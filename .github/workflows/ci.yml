name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly: does every optional extra still install?
    - cron: "17 3 * * 1"
  workflow_dispatch:

env:
  # The extras the tests exercise. `all` also pulls frameworks (crewai,
  # llama-index, ...) whose pins conflict on some Python versions; the
  # weekly `extras` job reports on those separately.
  TEST_EXTRAS: dev,ml,fastapi,documents,mcp,openai,anthropic,observability,language,sentiment,langchain,haystack,pydantic-ai
  HF_HUB_DISABLE_XET: "1"

jobs:
  test:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          # CPU build: the default Linux wheel ships CUDA and is several GB.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          # On failure, the end of pip's output becomes an annotation.
          if ! pip install -e ".[${TEST_EXTRAS}]" > pip.log 2>&1; then
            tail -n 40 pip.log
            echo "::error title=pip install failed::$(tail -n 25 pip.log | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit 1
          fi
      - name: Cache classifier models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('src/kestral/detectors/d022_semantic_classifier.py', 'src/kestral/inspector.py', 'scripts/fetch_models.py') }}
      - name: Fetch pinned models
        run: python scripts/fetch_models.py
      - name: Lint
        run: ruff check src/ tests/ scripts/
      - name: Format check
        run: ruff format --check src/ tests/ scripts/
      - name: Type check
        run: mypy src/
      - name: Test
        env:
          HF_HUB_OFFLINE: "1"
        run: pytest --cov=kestral --cov-report=xml --junitxml=junit.xml
      - name: Annotate failed tests
        if: failure()
        run: test -f junit.xml && python scripts/ci_annotate.py junit.xml || true
      - name: No unexpected skips
        run: python scripts/check_skips.py junit.xml tests/allowed_skips.txt
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.12'

  extras:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
        extra: [llamaindex, django, crewai, flask, capabilities-pipelock, capabilities-jws]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install extra
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,${{ matrix.extra }}]"
