services:
  kestral:
    build: .
    ports:
      - "8000:8000"
    environment:
      - KESTRAL_DATA_DIR=/home/kestral/data
      # Set keys to require authentication:
      # - KESTRAL_API_KEYS=key-for-the-app
      # - KESTRAL_ADMIN_KEYS=key-for-the-operator
    volumes:
      - kestral-data:/home/kestral/data
      - kestral-models:/home/kestral/.cache
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/livez"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

volumes:
  kestral-data:
  kestral-models:
