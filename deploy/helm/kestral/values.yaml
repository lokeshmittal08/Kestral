# Default values for kestral Helm chart.

replicaCount: 2

image:
  repository: kestral
  pullPolicy: IfNotPresent
  # Override appVersion from Chart.yaml when needed.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# --- Application configuration ---------------------------------------------
config:
  # block | monitor (reports what would be done; nothing is blocked,
  # removed or refused, and content is passed on unchanged)
  mode: block
  threshold: 0.7
  # Mounted as KESTRAL_DATA_DIR. Use a PVC for persistence.
  dataDir: /home/kestral/data
  # Extra env vars passed verbatim to the container, for example:
  extraEnv: []
  # - name: KESTRAL_API_KEYS          # keys that may call the service
  #   valueFrom: {secretKeyRef: {name: kestral-keys, key: api-keys}}
  # - name: KESTRAL_RATE_LIMIT        # requests/minute per valid key, else per
  #   value: "100"                    # client address; "0" turns it off
  # - name: KESTRAL_CORS_ORIGINS      # CORS is off unless origins are listed
  #   value: "https://app.example.com"
  # - name: FORWARDED_ALLOW_IPS       # behind an Ingress: trust X-Forwarded-For
  #   value: "10.0.0.0/8"              # from the controller's addresses

# --- Service account --------------------------------------------------------
serviceAccount:
  create: true
  annotations: {}
  name: ""

# --- Pod security -----------------------------------------------------------
podAnnotations: {}
podSecurityContext:
  fsGroup: 1000
  runAsNonRoot: true
  runAsUser: 1000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 1000

# --- Service ----------------------------------------------------------------
service:
  type: ClusterIP
  port: 8000
  annotations: {}

# --- Ingress ----------------------------------------------------------------
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: kestral.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# --- Resources --------------------------------------------------------------
resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 200m
    memory: 256Mi

# --- Autoscaling ------------------------------------------------------------
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

# --- Persistence (for vault, history, feedback databases) -------------------
persistence:
  enabled: false
  accessMode: ReadWriteOnce
  size: 1Gi
  storageClass: ""
  annotations: {}

# --- Probes -----------------------------------------------------------------
livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 15
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

# --- Scheduling -------------------------------------------------------------
nodeSelector: {}
tolerations: []
affinity: {}
