# Default values for kestral Helm chart.

replicaCount: 2

image:
  repository: kestral
  pullPolicy: IfNotPresent
  # Override appVersion from Chart.yaml when needed.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# --- Application configuration ---------------------------------------------
config:
  # block | monitor (reports what would be done; nothing is blocked,
  # removed or refused, and content is passed on unchanged)
  mode: block
  threshold: 0.7
  # Mounted as KESTRAL_DATA_DIR. Use a PVC for persistence.
  dataDir: /home/kestral/data
  # The model provider the gateway forwards to, for example
  # https://api.openai.com/v1 or a model served in your own network.
  # Empty: /v1/chat/completions refuses every request.
  upstreamUrl: ""
  # Extra env vars passed verbatim to the container, for example:
  extraEnv: []
  # - name: KESTRAL_RATE_LIMIT        # requests/minute per valid key, else per
  #   value: "100"                    # client address; "0" turns it off
  # - name: KESTRAL_CORS_ORIGINS      # CORS is off unless origins are listed
  #   value: "https://app.example.com"
  # - name: FORWARDED_ALLOW_IPS       # behind an Ingress: trust X-Forwarded-For
  #   value: "10.0.0.0/8"              # from the controller's addresses

# --- Authentication ---------------------------------------------------------
auth:
  # A Secret holding the keys, created beforehand, for example:
  #   kubectl create secret generic kestral-keys \
  #     --from-literal=api-keys=KEY1,KEY2 --from-literal=admin-keys=OPKEY
  existingSecret: ""
  apiKeysKey: api-keys
  # Optional: keys that may also see detection detail.
  adminKeysKey: admin-keys
  # The chart refuses to render without keys (existingSecret, or
  # KESTRAL_API_KEYS / KESTRAL_ADMIN_KEYS in config.extraEnv) unless this is true. Without keys the
  # service answers only callers inside the pod (such as kubectl
  # port-forward) and refuses any request relayed by a proxy. A sidecar that
  # forwards to localhost without adding X-Forwarded-For would look local,
  # so set keys whenever the pod has one.
  allowNoKeys: false

# --- Service account --------------------------------------------------------
serviceAccount:
  create: true
  annotations: {}
  name: ""

# --- Pod security -----------------------------------------------------------
podAnnotations: {}
podSecurityContext:
  fsGroup: 1000
  runAsNonRoot: true
  runAsUser: 1000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 1000

# --- Service ----------------------------------------------------------------
service:
  type: ClusterIP
  port: 8000
  annotations: {}

# --- Ingress ----------------------------------------------------------------
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: kestral.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# --- Resources --------------------------------------------------------------
# The classifier alone takes about 0.8 GB once loaded; 1 GiB is not enough.
resources:
  limits:
    cpu: 2000m
    memory: 2Gi
  requests:
    cpu: 500m
    memory: 1Gi

# --- Autoscaling ------------------------------------------------------------
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

# --- Persistence (for vault, history, feedback databases) -------------------
persistence:
  enabled: false
  accessMode: ReadWriteOnce
  size: 1Gi
  storageClass: ""
  annotations: {}

# --- Probes -----------------------------------------------------------------
# Liveness: the process answers. Readiness: the ML classifier has loaded, so
# no traffic reaches a pod that would pass attacks its classifier would catch.
# Startup: loading the classifier can take a minute; allow up to five.
startupProbe:
  httpGet:
    path: /readyz
    port: http
  periodSeconds: 10
  timeoutSeconds: 10
  failureThreshold: 30

livenessProbe:
  httpGet:
    path: /livez
    port: http
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /readyz
    port: http
  periodSeconds: 10
  timeoutSeconds: 10
  failureThreshold: 3

# --- Scheduling -------------------------------------------------------------
nodeSelector: {}
tolerations: []
affinity: {}
