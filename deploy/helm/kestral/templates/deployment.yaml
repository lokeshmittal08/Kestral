{{- $envKeys := false }}
{{- range .Values.config.extraEnv }}
{{- if has .name (list "KESTRAL_API_KEYS" "KESTRAL_ADMIN_KEYS") }}{{- $envKeys = true }}{{- end }}
{{- end }}
{{- if and .Values.auth.existingSecret $envKeys }}
{{- fail "API or admin keys are set both by auth.existingSecret and in config.extraEnv; keep one." }}
{{- end }}
{{- if not (or .Values.auth.existingSecret $envKeys .Values.auth.allowNoKeys) }}
{{- fail "Set auth.existingSecret to a Secret holding the API keys (or auth.allowNoKeys=true for a pod reachable only through port-forward)." }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kestral.fullname" . }}
  labels:
    {{- include "kestral.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "kestral.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kestral.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "kestral.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: {{ include "kestral.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "kestral.fullname" . }}-config
          {{- if or .Values.auth.existingSecret .Values.config.extraEnv }}
          env:
            {{- with .Values.auth.existingSecret }}
            - name: KESTRAL_API_KEYS
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.auth.apiKeysKey }}
            - name: KESTRAL_ADMIN_KEYS
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.auth.adminKeysKey }}
                  optional: true
            {{- end }}
            {{- with .Values.config.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          startupProbe:
            {{- toYaml .Values.startupProbe | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if .Values.persistence.enabled }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.config.dataDir }}
          {{- end }}
      {{- if .Values.persistence.enabled }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "kestral.fullname" . }}-data
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
