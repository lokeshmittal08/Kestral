apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kestral.fullname" . }}-config
  labels:
    {{- include "kestral.labels" . | nindent 4 }}
data:
  KESTRAL_MODE: {{ .Values.config.mode | quote }}
  KESTRAL_THRESHOLD: {{ .Values.config.threshold | quote }}
  KESTRAL_DATA_DIR: {{ .Values.config.dataDir | quote }}
